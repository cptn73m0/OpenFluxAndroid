name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android repo
        uses: actions/checkout@v4
        with:
          path: android

      - name: Checkout OpenFlux
        uses: actions/checkout@v4
        with:
          repository: cptn73m0/OpenFlux
          ref: main
          path: openflux

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false

      - name: Build arm64 binary
        run: |
          NDK="${{ env.ANDROID_NDK_HOME }}"
          if [ -z "$NDK" ]; then
            NDK=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          fi
          echo "NDK: $NDK"
          export GOARCH=arm64
          export GOOS=android
          export CGO_ENABLED=1
          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++"
          export CGO_CFLAGS="-march=armv8-a -O2"
          cd openflux
          go build -v             -ldflags="-s -w -linkmode external -extldflags '-Wl,-rpath,/system/lib64 -Wl,-rpath,/vendor/lib64' -checklinkname=0"             -o libp1npplydtransport.so .
          file libp1npplydtransport.so
          mkdir -p $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a
          cp libp1npplydtransport.so $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/

      - name: Fix lint
        run: |
          cd android/app/src/main/res/values
          patch -l strings.xml << 'EOF' || true
          --- strings.xml
          +++ strings.xml
          @@ -1,4 +1,9 @@
          +<?xml version="1.0" encoding="utf-8"?>
          +<resources>
           <string name="err_service_not_connected">Service not connected</string>
           <string name="err_vpn_iface_not_ready">VPN interface not ready</string>
           <string name="err_transport_not_started">Transport not started</string>
           <string name="err_tun2socks_not_started">tun2socks not started</string>
           <string name="err_transport_binary_missing">Transport binary not found</string>
           <string name="err_invalid_fd">Invalid tun fd</string>
           <string name="err_pdnsd_missing">pdnsd binary not found</string>
           <string name="err_tun2socks_missing">tun2socks binary not found</string>
           <string name="err_sendfd_failed">Failed to send tun fd</string>
          +</resources>
          EOF
          ls strings.xml

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Build APK (debug, skip lint errors)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openflux-apk
          path: android/app/build/outputs/apk/debug/*.apk