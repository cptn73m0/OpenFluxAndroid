name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android repo
        uses: actions/checkout@v4
        with:
          path: android

      - name: Checkout OpenFlux
        uses: actions/checkout@v4
        with:
          repository: cptn73m0/OpenFlux
          ref: main
          path: openflux

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false

      - name: Build arm64 binary
        run: |
          NDK="${{ env.ANDROID_NDK_HOME }}"
          if [ -z "$NDK" ]; then
            NDK=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          fi
          echo "NDK: $NDK"
          export GOARCH=arm64
          export GOOS=android
          export CGO_ENABLED=1
          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++"
          export CGO_CFLAGS="-march=armv8-a -O2"
          cd openflux
          go build -v             -ldflags="-s -w -linkmode external -extldflags '-Wl,-rpath,/system/lib64 -Wl,-rpath,/vendor/lib64' -checklinkname=0"             -o libp1npplydtransport.so .
          file libp1npplydtransport.so
          mkdir -p $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a
          cp libp1npplydtransport.so $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openflux-apk
          path: android/app/build/outputs/apk/release/*.apk